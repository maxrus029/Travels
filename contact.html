<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подорожі — Контакти</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="head">
        <img class="logo" src="img/logo.png" alt="логотип">
        <nav class="menu">
            <ul class="menu-links">
                <li class="menu-item"><a class="menu-item-link" href="index.html">Головна</a></li>
                <li class="menu-item"><a class="menu-item-link" href="destinations.html">Напрямки</a></li>
                <li class="menu-item"><a class="menu-item-link" href="contact.html">Контакти</a></li>
            </ul>
        </nav>
    </header>
    <section class="contact">
        <h2 class="contact-title">Контакти</h2>
        <form class="form">
            <label class="form-label" for="name">Ім'я</label>
            <input class="form-input" type="text" id="name" name="name" required>
            <label class="form-label" for="email">Електронна пошта</label>
            <input class="form-input" type="email" id="email" name="email" required>
            <label class="form-label" for="message">Повідомлення</label>
            <textarea class="form-textarea" id="message" name="message" rows="5" required></textarea>
            <button class="form-button" type="submit">Відправити</button>
        </form>
    </section>
    <footer class="footer">
        <p class="footer-info">&copy; 2026 Подорожі. Автор: Руснак М. Всі права захищено.</p>
    </footer>
</body>
</html>
